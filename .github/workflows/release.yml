name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: pcrc-server
            artifact: pcrc-server-linux-x86_64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: pcrc-server.exe
            artifact: pcrc-server-windows-x86_64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release -p pcrc-server --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" dist/
          cp README.md LICENSE dist/
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../${{ matrix.artifact }}.zip" .
          else
            tar -czf "../${{ matrix.artifact }}.tar.gz" .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.archive }}

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  build-macos:
    name: build macOS (arm64 + x86_64)
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build (arm64)
        run: cargo build --release -p pcrc-server --target aarch64-apple-darwin
      - name: Build (x86_64)
        run: cargo build --release -p pcrc-server --target x86_64-apple-darwin
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            if [ "$target" = "aarch64-apple-darwin" ]; then name=pcrc-server-macos-arm64; else name=pcrc-server-macos-x86_64; fi
            mkdir -p "dist-$name"
            cp "target/$target/release/pcrc-server" "dist-$name/"
            cp README.md LICENSE "dist-$name/"
            (cd "dist-$name" && tar -czf "../$name.tar.gz" .)
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            pcrc-server-macos-arm64.tar.gz
            pcrc-server-macos-x86_64.tar.gz
